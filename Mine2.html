<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Steve Parkour HD - COMPLETÍSSIMO</title>
    <style>
        body { margin: 0; overflow: hidden; background: #9db9eb; font-family: 'Arial', sans-serif; touch-action: none; }
        canvas { display: block; }
        .overlay { position: absolute; inset: 0; background: #9db9eb; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 500; text-align: center; }
        #deathMenu, #shopMenu, #adminMenu, #nameScreen, #profileMenu, #rankMenu { background: rgba(0,0,0,0.9); color: white; }
        .btn { width: 280px; padding: 15px; margin: 10px; font-size: 18px; font-weight: bold; color: white; border: none; border-radius: 12px; cursor: pointer; pointer-events: auto; box-shadow: 0 4px #222; }
        .btn-start { background: #4caf50; }
        .btn-shop { background: #9c27b0; }
        .btn-rank { background: #ff9800; }
        .btn-menu { background: #757575; }
        .name-input { padding: 12px; margin: 8px; border-radius: 8px; border: 1px solid #00e5ff; width: 260px; font-size: 16px; color: black; }
        #mainProfileBtn { position: absolute; top: 15px; left: 15px; width: 120px; background: #2196f3; z-index: 1000; padding: 10px; border-radius: 10px; border: none; color: white; font-weight: bold; cursor: pointer; }
        #ui { position: absolute; top: 10px; left: 150px; background: rgba(0,0,0,0.7); color: white; padding: 10px; border-radius: 8px; z-index: 100; display: none; border: 1px solid #fff; pointer-events: none; }
        .controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; z-index: 150; }
        .ctrl-btn { width: 80px; height: 80px; background: rgba(255,255,255,0.4); border: 3px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; color: white; user-select: none; }
    </style>
</head>
<body>

    <button id="mainProfileBtn" onclick="openProfile()">👤 PERFIL</button>

    <div id="menu" class="overlay" style="display: flex;">
        <h1 style="color:white; text-shadow: 3px 3px #000; font-size: 40px;">STEVE PARKOUR</h1>
        <button class="btn btn-start" onclick="checkNameBeforeStart()">JOGAR</button>
        <button class="btn btn-shop" onclick="openShop()">LOJA SKINS 🛒</button>
        <button class="btn btn-rank" onclick="openRank()">PLACAR 🪧</button>
    </div>

    <!-- Menus omitidos para brevidade, mas funcionais -->
    <div id="shopMenu" class="overlay"><h1>LOJA</h1><button class="btn btn-menu" onclick="closeShop()">VOLTAR</button></div>
    <div id="nameScreen" class="overlay"><h1>NOME?</h1><input type="text" id="userNameInput" class="name-input"><button class="btn btn-start" onclick="saveNameAndStart()">OK</button></div>
    <div id="deathMenu" class="overlay"><h1>FIM DE JOGO</h1><button class="btn btn-start" onclick="initGame(true)">RECOMEÇAR</button></div>

    <div id="ui">👤 <span id="skinLabel">STEVE</span> | 🏁 <span id="dist">0</span>m | 💎 <span id="coins">0</span> <span id="abilityStatus"></span></div>

    <div class="controls" id="mobileControls">
        <div style="display:flex; gap:15px"><div class="ctrl-btn" id="btnLeft">←</div><div class="ctrl-btn" id="btnRight">→</div></div>
        <div class="ctrl-btn" id="btnJump">↑</div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let gameRunning = false, world = {}, cameraX = 0, coins = parseInt(localStorage.getItem("steve_coins")) || 0;
let userName = localStorage.getItem("steve_user_name") || "", currentSkin = "steve";
let gems = [], lastGeneratedX = 0, checkpointsAchieved = [];
let metersAtLastTp = 0, metersAtLastDoubleJump = 0;
const player = { x: 100, y: 300, w: 32, h: 64, vx: 0, vy: 0, onGround: false };
const input = { left: false, right: false };

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

// CONTROLES MÓVEIS CORRIGIDOS
function setupMobileControls() {
    const bind = (id, start, end) => {
        const el = document.getElementById(id);
        el.addEventListener("touchstart", (e) => { e.preventDefault(); start(); });
        el.addEventListener("touchend", (e) => { e.preventDefault(); end(); });
    };
    bind("btnLeft", () => input.left = true, () => input.left = false);
    bind("btnRight", () => input.right = true, () => input.right = false);
    document.getElementById("btnJump").addEventListener("touchstart", (e) => {
        e.preventDefault();
        let m = Math.floor(player.x / 50);
        if(player.onGround) player.vy = -17;
        else if(currentSkin === "herobrine" && (m - metersAtLastTp >= 50)) { player.x += 400; metersAtLastTp = m; }
        else if(currentSkin === "mrbeast" && (m - metersAtLastDoubleJump >= 80)) { player.vy = -15; metersAtLastDoubleJump = m; }
    });
}
setupMobileControls();

function generateBlocks(count) {
    for(let i = 0; i < count; i++) {
        lastGeneratedX += 200;
        let y = Math.floor((300 + Math.random() * 200)/50)*50;
        world[`${lastGeneratedX},${y}`] = "grass";
        let rand = Math.random();
        gems.push({x: lastGeneratedX + 15, y: y - 60, type: (rand<0.1?"red":(rand<0.3?"blue":"green")), collected: false});
    }
}

function initGame(reset) {
    if(reset) { world = {}; gems = []; lastGeneratedX = 0; generateBlocks(30); }
    gameRunning = true; document.getElementById("menu").style.display = "none"; document.getElementById("ui").style.display = "block";
    requestAnimationFrame(loop);
}

function loop() {
    if(!gameRunning) return;
    let m = Math.floor(player.x / 50);
    player.vy += 0.8; player.y += player.vy; player.onGround = false;
    
    // Movimento lateral
    if(input.left) player.x -= 6; if(input.right) player.x += 6;

    for(let pos in world) {
        let [bx, by] = pos.split(",").map(Number);
        if(player.x+32 > bx && player.x < bx+50 && player.y+64 > by && player.y+64 < by+20 && player.vy > 0) {
            player.y = by - 64; player.vy = 0; player.onGround = true;
        }
    }
    player.x += 4; cameraX += (player.x - canvas.width/3 - cameraX) * 0.1;
    
    // HUD
    if(currentSkin === "herobrine") document.getElementById("abilityStatus").innerText = (m - metersAtLastTp >= 50) ? " | TP PRONTO!" : ` | TP: ${50-(m-metersAtLastTp)}m`;

    ctx.clearRect(0,0,canvas.width, canvas.height);
    for(let pos in world) { let [bx, by] = pos.split(",").map(Number); ctx.fillStyle = "#4caf50"; ctx.fillRect(bx-cameraX, by, 50, 15); }
    ctx.fillStyle = "#3c44aa"; ctx.fillRect(player.x-cameraX+4, player.y+40, 24, 24); 
    
    document.getElementById("dist").innerText = m;
    if(player.y > canvas.height) document.getElementById("deathMenu").style.display = "flex";
    else requestAnimationFrame(loop);
}

function checkNameBeforeStart() { userName ? initGame(true) : document.getElementById("nameScreen").style.display = "flex"; }
function saveNameAndStart() { userName = document.getElementById("userNameInput").value; localStorage.setItem("steve_user_name", userName); initGame(true); }
function openShop() { document.getElementById("shopMenu").style.display = "flex"; }
function closeShop() { document.getElementById("shopMenu").style.display = "none"; }
function openProfile() { alert("Nome: " + userName); }
function openRank() { alert("Ranking em breve!"); }
</script>
</body>
</html>
