<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Steve Parkour HD - Ranking Update</title>
    <style>
        body { margin: 0; overflow: hidden; background: #9db9eb; font-family: 'Arial', sans-serif; touch-action: none; }
        canvas { display: block; }
        
        .overlay { position: absolute; inset: 0; background: #9db9eb; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; text-align: center; }
        #menu { display: flex; }

        #deathMenu, #shopMenu, #adminMenu, #nameScreen, #profileMenu, #rankMenu { background: rgba(0,0,0,0.95); color: white; z-index: 300; }
        
        .admin-input, .name-input { padding: 12px; margin: 8px; border-radius: 8px; border: 1px solid #00e5ff; width: 280px; background: #222; color: white; font-size: 16px; }
        .btn { width: 280px; padding: 15px; margin: 6px; font-size: 18px; font-weight: bold; color: white; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px #222; }
        .btn-start { background: #4caf50; }
        .btn-shop { background: #9c27b0; }
        .btn-rank { background: #ff9800; }
        .btn-menu { background: #757575; }
        
        #mainProfileBtn { position: absolute; top: 15px; left: 15px; width: 120px; background: #2196f3; z-index: 400; font-size: 14px; padding: 10px; border-radius: 10px; border: none; color: white; font-weight: bold; cursor: pointer; }
        #ui { position: absolute; top: 10px; left: 150px; background: rgba(0,0,0,0.7); color: white; padding: 10px; border-radius: 8px; z-index: 100; display: none; font-size: 14px; border: 1px solid #fff; }
        
        /* Estilo Tabela Ranking */
        .rank-card { background: #333; padding: 15px; border-radius: 15px; border: 2px solid #ff9800; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
        .my-stats { background: #444; padding: 10px; border-radius: 10px; border: 1px solid #00e5ff; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { border-bottom: 2px solid #555; padding: 8px; color: #ff9800; }
        td { padding: 8px; border-bottom: 1px solid #444; }
        .highlight { color: #00e5ff; font-weight: bold; }

        #checkpointMsg { position: absolute; top: 20%; width: 100%; text-align: center; color: #00e5ff; font-size: 32px; font-weight: bold; display: none; text-shadow: 3px 3px #000; z-index: 150; pointer-events: none; }
        .controls { position: absolute; bottom: 20px; width: 100%; display: none; justify-content: space-between; padding: 0 30px; box-sizing: border-box; z-index: 150; }
        .ctrl-btn { width: 70px; height: 70px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 25px; color: white; user-select: none; }
    </style>
</head>
<body>

    <button id="mainProfileBtn" onclick="openProfile()">👤 PERFIL</button>
    <div id="checkpointMsg">CHECKPOINT! 🚩</div>

    <div id="menu" class="overlay">
        <h1 style="color:white; text-shadow: 3px 3px #000; font-size: 40px; margin-bottom: 5px;">STEVE PARKOUR HD</h1>
        <button class="btn btn-start" onclick="checkNameBeforeStart()">JOGAR</button>
        <button class="btn btn-shop" onclick="openShop()">LOJA SKINS 🛒</button>
        <button class="btn btn-rank" onclick="openRank()">PLACAR 🪧</button>
    </div>

    <div id="rankMenu" class="overlay">
        <div class="rank-card">
            <h2 style="color:#ff9800">TOP 10 MUNDIAL</h2>
            <div class="my-stats">
                <p style="margin: 5px 0;"><b>VOCÊ:</b> <span id="myName"></span></p>
                <p style="margin: 5px 0; font-size: 13px;">
                    Posição: <span class="highlight">#4</span> | 
                    Metros: <span class="highlight" id="myMetros">0</span> | 
                    💎: <span class="highlight" id="myGems">0</span>
                </p>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Nome</th>
                        <th>💎</th>
                        <th>Metros</th>
                    </tr>
                </thead>
                <tbody id="rankBody">
                    </tbody>
            </table>
            <button class="btn btn-menu" onclick="closeRank()" style="width:100%; margin-top:15px;">VOLTAR</button>
        </div>
    </div>

    <div id="nameScreen" class="overlay">
        <h1>QUAL SEU NOME?</h1>
        <input type="text" id="userNameInput" class="name-input" placeholder="Digite aqui...">
        <button class="btn btn-start" onclick="saveNameAndStart()">CONFIRMAR</button>
    </div>

    <div id="profileMenu" class="overlay">
        <div class="rank-card" style="border-color:#00e5ff">
            <h2>PERFIL</h2>
            <p style="font-size: 22px;"><span id="displayUserName"></span> <span class="edit-btn" onclick="editName()">✏️</span></p>
            <p>🏆 Recorde: <span id="profileBest">0</span>m</p>
            <p>💎 Esmeraldas: <span id="profileCoins">0</span></p>
            <button class="btn btn-menu" onclick="closeProfile()">VOLTAR</button>
        </div>
    </div>

    <div id="adminMenu" class="overlay">
        <h1 style="color:red">PAINEL ADMIN</h1>
        <div id="adminLogin">
            <input type="email" id="adminEmail" class="admin-input" placeholder="E-mail">
            <input type="password" id="adminPass" class="admin-input" placeholder="Senha">
            <button class="btn btn-start" onclick="checkAdminLogin()">LOGAR</button>
        </div>
        <div id="adminControls" style="display:none">
            <button class="btn btn-shop" onclick="adminAddGems()">+10.000 GEMS</button>
            <button class="btn btn-menu" onclick="adminToggleGod()">GOD MODE: <span id="godStatus">OFF</span></button>
            <button class="btn btn-menu" onclick="closeAdmin()">SAIR</button>
        </div>
    </div>

    <div id="shopMenu" class="overlay">
        <h1>LOJA</h1>
        <p>💎 <span id="shopCoins">0</span></p>
        <div style="display:flex; flex-direction:column; gap:10px;">
            <button id="btnHero" class="btn btn-shop" onclick="handleSkinAction('herobrine')">HEROBRINE (2500 💎)</button>
            <button id="btnBeast" class="btn btn-shop" style="background:#2196f3" onclick="handleSkinAction('mrbeast')">MR BEAST (250 💎)</button>
        </div>
        <button class="btn btn-menu" onclick="closeShop()" style="margin-top:10px">VOLTAR</button>
    </div>

    <div id="ui">👤 <span id="skinLabel">Steve</span> | <span id="adminTrigger" onclick="handleAdminTrigger()" style="cursor:pointer">🏁 <span id="dist">0</span>m</span> | 💎 <span id="coins">0</span></div>

    <div id="deathMenu" class="overlay">
        <h1>FIM DE JOGO</h1>
        <button class="btn btn-start" onclick="initGame(false)">CHECKPOINT 🚩</button>
        <button class="btn btn-menu" onclick="location.reload()">MENU</button>
    </div>

    <div class="controls" id="mobileControls">
        <div style="display:flex; gap:15px"><div class="ctrl-btn" id="btnLeft">←</div><div class="ctrl-btn" id="btnRight">→</div></div>
        <div class="ctrl-btn" id="btnJump">↑</div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
// CONFIGURAÇÕES E VARIÁVEIS (NÃO APAGADO)
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let gameRunning = false, physicsActive = false, world = {}, cameraX = 0, lastX = 0;
let coins = parseInt(localStorage.getItem("steve_coins")) || 0;
let highScore = parseInt(localStorage.getItem("steve_record")) || 0;
let userName = localStorage.getItem("steve_user_name") || "";
let hasHerobrine = localStorage.getItem("skin_herobrine") === "true";
let hasMrBeast = localStorage.getItem("skin_mrbeast") === "true";
let currentSkin = "steve";
let gems = [], lastCheckpoint = { x: 100, y: 0 }, checkpointsAchieved = [];
let adminClicks = 0, lastClickTime = 0, isGodMode = false, doubleJumpUsed = false;
let GRAV_UP = 0.7, GRAV_DOWN = 0.82, JUMP_FORCE = -17.5, SPEED = 6.5;
const player = { x: 100, y: 0, w: 32, h: 64, vx: 0, vy: 0, onGround: false };
const input = { left: false, right: false };

// SISTEMA DE RANKING
const fakeRank = [
    {n: "Dream", g: 15000, m: 5200},
    {n: "Technoblade", g: 12000, m: 4850},
    {n: "GeorgeNotFound", g: 8500, m: 3100},
    {n: "AuthenticGames", g: 6000, m: 2400},
    {n: "Felipe Neto", g: 5500, m: 2100},
    {n: "Jazzghost", g: 4200, m: 1850},
    {n: "Viniccius13", g: 99999, m: 9999},
    {n: "TazerCraft", g: 3100, m: 1200},
    {n: "Geleia", g: 2500, m: 950}
];

function openRank() {
    document.getElementById("myName").innerText = userName || "Jogador";
    document.getElementById("myMetros").innerText = highScore + "m";
    document.getElementById("myGems").innerText = coins;
    
    let html = "";
    // Adiciona você e os fakes
    let fullList = [...fakeRank, {n: userName || "Você", g: coins, m: highScore}];
    fullList.sort((a,b) => b.m - a.m); // Ordena por metros

    fullList.slice(0, 10).forEach((p, i) => {
        let isMe = (p.n === userName || p.n === "Você");
        html += `<tr style="${isMe?'background:rgba(0,229,255,0.2)':''}">
            <td>#${i+1}</td>
            <td class="${isMe?'highlight':''}">${p.n}</td>
            <td>${p.g}</td>
            <td>${p.m}m</td>
        </tr>`;
    });
    document.getElementById("rankBody").innerHTML = html;
    document.getElementById("rankMenu").style.display = "flex";
}
function closeRank() { document.getElementById("rankMenu").style.display = "none"; }

// FUNÇÕES ORIGINAIS (NÃO ALTERADAS)
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

function checkNameBeforeStart() { if (userName === "") document.getElementById("nameScreen").style.display = "flex"; else initGame(true); }
function saveNameAndStart() { let val = document.getElementById("userNameInput").value.trim(); if (val.length < 2) return alert("Nome curto!"); userName = val; localStorage.setItem("steve_user_name", userName); document.getElementById("nameScreen").style.display = "none"; initGame(true); }
function openProfile() { document.getElementById("displayUserName").innerText = userName || "Jogador"; document.getElementById("profileBest").innerText = highScore; document.getElementById("profileCoins").innerText = coins; document.getElementById("profileMenu").style.display = "flex"; }
function closeProfile() { document.getElementById("profileMenu").style.display = "none"; }
function editName() { let n = prompt("Novo nome:", userName); if(n && n.trim().length >= 2) { userName = n.trim(); localStorage.setItem("steve_user_name", userName); openProfile(); } }

function handleAdminTrigger() { let now = Date.now(); if (now - lastClickTime < 500) adminClicks++; else adminClicks = 1; lastClickTime = now; if (adminClicks >= 5) { document.getElementById("adminMenu").style.display = "flex"; adminClicks = 0; } }
function checkAdminLogin() { if (document.getElementById("adminEmail").value === "gu24gamer@gmail.com" && document.getElementById("adminPass").value === "gu_totoso_24/11/2015") { document.getElementById("adminLogin").style.display = "none"; document.getElementById("adminControls").style.display = "block"; } else alert("Dados incorretos!"); }
function closeAdmin() { document.getElementById("adminMenu").style.display = "none"; }
function adminAddGems() { coins += 10000; document.getElementById("coins").innerText = coins; }
function adminToggleGod() { isGodMode = !isGodMode; document.getElementById("godStatus").innerText = isGodMode ? "ON" : "OFF"; }

function generateBlocks(startX, count) {
    let x = startX; let lastY = canvas.height * 0.6;
    for(let i = 0; i < count; i++) {
        x += 150 + Math.random() * 75;
        let newY = Math.max(canvas.height * 0.35, Math.min(canvas.height * 0.75, lastY + (Math.random() * 100 - 50)));
        let bx = Math.floor(x/50)*50, by = Math.floor(newY/50)*50;
        if (Math.floor(bx/50) % 80 === 0) world[`${bx},${by}`] = "checkpoint";
        else world[`${bx},${by}`] = "grass";
        if (Math.random() > 0.45) gems.push({ x: bx + 15, y: by - 60, collected: false });
        lastX = x; lastY = by;
    }
}

function handleJump() {
    physicsActive = true;
    if(player.onGround) { player.vy = JUMP_FORCE; player.onGround = false; doubleJumpUsed = false; }
    else if(currentSkin === "mrbeast" && !doubleJumpUsed) { player.vy = JUMP_FORCE * 0.85; doubleJumpUsed = true; }
}

function initGame(resetAll) {
    document.querySelectorAll(".overlay").forEach(el => el.style.display = "none");
    document.getElementById("mainProfileBtn").style.display = "none";
    document.getElementById("ui").style.display = "block";
    document.getElementById("skinLabel").innerText = currentSkin.toUpperCase();
    if (resetAll) {
        world = {}; gems = []; checkpointsAchieved = [];
        lastCheckpoint = { x: 100, y: Math.floor(canvas.height*0.75/50)*50 };
        for(let i=0; i<8; i++) world[`${i*50},${lastCheckpoint.y}`] = "grass";
        generateBlocks(500, 15);
    }
    player.x = lastCheckpoint.x; player.y = lastCheckpoint.y - 100;
    player.vy = 0; physicsActive = false; gameRunning = true;
    if ('ontouchstart' in window) document.getElementById("mobileControls").style.display = "flex";
    requestAnimationFrame(loop);
}

function loop() {
    if(!gameRunning) return;
    if(physicsActive) {
        if(input.left) player.vx = -SPEED; else if(input.right) player.vx = SPEED; else player.vx *= 0.82;
        player.vy += (player.vy < 0) ? GRAV_UP : GRAV_DOWN;
        player.x += player.vx; player.y += player.vy;
        player.onGround = false;
        for(let pos in world) {
            let [bx, by] = pos.split(",").map(Number);
            if(player.x + player.w > bx && player.x < bx + 50 && player.y + player.h > by && player.y + player.h < by + 20 && player.vy > 0) {
                player.y = by - player.h; player.vy = 0; player.onGround = true; doubleJumpUsed = false;
                if(world[pos] === "checkpoint" && !checkpointsAchieved.includes(pos)) {
                    lastCheckpoint = { x: bx, y: by }; checkpointsAchieved.push(pos);
                    document.getElementById("checkpointMsg").style.display = "block";
                    setTimeout(() => document.getElementById("checkpointMsg").style.display = "none", 1200);
                }
            }
        }
        gems.forEach(g => { if(!g.collected && player.x < g.x+20 && player.x+32 > g.x && player.y < g.y+30 && player.y+64 > g.y) { g.collected = true; coins++; document.getElementById("coins").innerText = coins; } });
        if(player.y > canvas.height + 150) {
            if(isGodMode) { player.y = -100; player.vy = 0; }
            else { 
                gameRunning = false; highScore = Math.max(highScore, Math.floor(player.x/50));
                localStorage.setItem("steve_record", highScore); localStorage.setItem("steve_coins", coins);
                document.getElementById("deathMenu").style.display = "flex"; document.getElementById("mainProfileBtn").style.display = "block";
                return;
            }
        }
        cameraX += (player.x - canvas.width/3 - cameraX) * 0.12;
        if(player.x > lastX - 1200) generateBlocks(lastX, 10);
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for(let pos in world) {
        let [bx, by] = pos.split(",").map(Number);
        if(bx > cameraX - 100 && bx < cameraX + canvas.width) {
            if(world[pos] === "checkpoint") {
                ctx.fillStyle = "#333"; ctx.fillRect(bx-cameraX+22, by-45, 6, 45);
                ctx.fillStyle = "#00e5ff"; ctx.fillRect(bx-cameraX+28, by-45, 22, 16);
            } else {
                ctx.fillStyle = "#795548"; ctx.fillRect(bx-cameraX, by, 50, 50);
                ctx.fillStyle = "#4caf50"; ctx.fillRect(bx-cameraX, by, 50, 15);
            }
        }
    }
    gems.forEach(g => { if(!g.collected) { ctx.fillStyle = "#00ff00"; ctx.fillRect(g.x-cameraX, g.y, 20, 30); ctx.strokeStyle="white"; ctx.strokeRect(g.x-cameraX, g.y, 20, 30); } });
    
    let sx = player.x - cameraX, sy = player.y;
    if(currentSkin === "mrbeast") {
        ctx.fillStyle = "#9e7a5c"; ctx.fillRect(sx+4, sy+40, 10, 24); ctx.fillRect(sx+18, sy+40, 10, 24); 
        ctx.fillStyle = "#111"; ctx.fillRect(sx+4, sy+18, 24, 22);
        ctx.fillStyle = "#2196f3"; ctx.fillRect(sx+10, sy+24, 12, 8); 
        ctx.fillStyle = "#f06292"; ctx.fillRect(sx+14, sy+26, 4, 4);
        ctx.fillStyle = "#e0ac69"; ctx.fillRect(sx-2, sy+18, 6, 20); ctx.fillRect(sx+28, sy+18, 6, 20); ctx.fillRect(sx+4, sy, 24, 20);
        ctx.fillStyle = "#a1887f"; ctx.fillRect(sx+4, sy, 24, 6);
        ctx.fillStyle = "#5d4037"; ctx.fillRect(sx+8, sy+16, 16, 4);
        ctx.fillStyle = "white"; ctx.fillRect(sx+7, sy+8, 6, 5); ctx.fillRect(sx+19, sy+8, 6, 5);
        ctx.fillStyle = "#4fc3f7"; ctx.fillRect(sx+9, sy+8, 3, 5); ctx.fillRect(sx+21, sy+8, 3, 5);
    } else {
        let isHero = (currentSkin === "herobrine");
        ctx.fillStyle = isHero ? "#1a1a1a" : "#3c44aa"; ctx.fillRect(sx+4, sy+40, 10, 24); ctx.fillRect(sx+18, sy+40, 10, 24);
        ctx.fillStyle = isHero ? "#333" : "#3aa0a2"; ctx.fillRect(sx+4, sy+18, 24, 22);
        ctx.fillStyle = isHero ? "#b28d7d" : "#d3a395"; ctx.fillRect(sx-2, sy+18, 6, 20); ctx.fillRect(sx+28, sy+18, 6, 20); ctx.fillRect(sx+4, sy, 24, 20);
        ctx.fillStyle = isHero ? "#3a2518" : "#4e342e"; ctx.fillRect(sx+4, sy, 24, 6);
        ctx.fillStyle = "white";
        if(isHero) { ctx.shadowBlur = 10; ctx.shadowColor = "white"; ctx.fillRect(sx+7, sy+9, 6, 5); ctx.fillRect(sx+19, sy+9, 6, 5); ctx.shadowBlur = 0; }
        else { ctx.fillRect(sx+7, sy+9, 6, 5); ctx.fillRect(sx+19, sy+9, 6, 5); ctx.fillStyle = "#3c44aa"; ctx.fillRect(sx+10, sy+9, 3, 5); ctx.fillRect(sx+22, sy+9, 3, 5); }
    }
    document.getElementById("dist").innerText = Math.floor(player.x/50);
    requestAnimationFrame(loop);
}

function openShop() { 
    document.getElementById("shopCoins").innerText = coins; 
    let bh = document.getElementById("btnHero"); let bb = document.getElementById("btnBeast");
    bh.innerText = hasHerobrine ? (currentSkin==="herobrine"?"EQUIPADO":"EQUIPAR HERO") : "COMPRAR HERO (2.500 💎)";
    bb.innerText = hasMrBeast ? (currentSkin==="mrbeast"?"EQUIPADO":"EQUIPAR BEAST") : "COMPRAR BEAST (250 💎)";
    document.getElementById("shopMenu").style.display = "flex"; 
}
function closeShop() { document.getElementById("shopMenu").style.display = "none"; }
function handleSkinAction(skin) { 
    if(skin === 'herobrine') { if(!hasHerobrine && coins >= 2500) { coins -= 2500; hasHerobrine = true; localStorage.setItem("skin_herobrine", "true"); } if(hasHerobrine) currentSkin = "herobrine"; }
    else if(skin === 'mrbeast') { if(!hasMrBeast && coins >= 250) { coins -= 250; hasMrBeast = true; localStorage.setItem("skin_mrbeast", "true"); } if(hasMrBeast) currentSkin = "mrbeast"; }
    localStorage.setItem("steve_coins", coins); openShop(); 
}

window.addEventListener("keydown", (e) => { if(e.code === "Space" || e.code === "ArrowUp") handleJump(); if(e.code === "KeyA" || e.code === "ArrowLeft") { physicsActive = true; input.left = true; } if(e.code === "KeyD" || e.code === "ArrowRight") { physicsActive = true; input.right = true; } });
window.addEventListener("keyup", (e) => { if(e.code === "KeyA" || e.code === "ArrowLeft") input.left = false; if(e.code === "KeyD" || e.code === "ArrowRight") input.right = false; });
const bind = (id, fn) => document.getElementById(id).addEventListener("touchstart", (e) => { e.preventDefault(); fn(); });
bind("btnLeft"
