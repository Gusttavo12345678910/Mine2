<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Steve Parkour HD - Versão Final</title>
    <style>
        body { margin: 0; overflow: hidden; background: #9db9eb; font-family: 'Arial', sans-serif; touch-action: none; }
        canvas { display: block; }
        .overlay { position: absolute; inset: 0; background: #9db9eb; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 500; text-align: center; }
        #deathMenu, #shopMenu, #adminMenu, #nameScreen, #profileMenu, #rankMenu { background: rgba(0,0,0,0.9); color: white; }
        .btn { width: 280px; padding: 15px; margin: 10px; font-size: 18px; font-weight: bold; color: white; border: none; border-radius: 12px; cursor: pointer; pointer-events: auto; box-shadow: 0 4px #222; }
        .btn-start { background: #4caf50; }
        .btn-shop { background: #9c27b0; }
        .btn-rank { background: #ff9800; }
        .btn-menu { background: #757575; }
        .name-input, .admin-input { padding: 12px; margin: 8px; border-radius: 8px; border: 1px solid #00e5ff; width: 260px; font-size: 16px; }
        #mainProfileBtn { position: absolute; top: 15px; left: 15px; width: 120px; background: #2196f3; z-index: 1000; padding: 10px; border-radius: 10px; border: none; color: white; font-weight: bold; cursor: pointer; }
        #ui { position: absolute; top: 10px; left: 150px; background: rgba(0,0,0,0.7); color: white; padding: 10px; border-radius: 8px; z-index: 100; display: none; border: 1px solid #fff; pointer-events: none; }
        .rank-card { background: #333; padding: 20px; border-radius: 20px; border: 2px solid #ff9800; width: 85%; max-width: 450px; }
        .highlight { color: #00e5ff; font-weight: bold; }
        .controls { position: absolute; bottom: 20px; width: 100%; display: none; justify-content: space-between; padding: 0 30px; box-sizing: border-box; z-index: 150; }
        .ctrl-btn { width: 70px; height: 70px; background: rgba(255,255,255,0.3); border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 25px; color: white; }
        #checkpointMsg { position: absolute; top: 20%; width: 100%; text-align: center; color: #ffeb3b; font-size: 40px; font-weight: bold; display: none; text-shadow: 3px 3px #000; z-index: 1000; }
    </style>
</head>
<body>

    <button id="mainProfileBtn" onclick="openProfile()">👤 PERFIL</button>

    <div id="menu" class="overlay" style="display: flex;">
        <h1 style="color:white; text-shadow: 3px 3px #000; font-size: 40px;">STEVE PARKOUR</h1>
        <button class="btn btn-start" onclick="checkNameBeforeStart()">JOGAR</button>
        <button class="btn btn-shop" onclick="openShop()">LOJA SKINS 🛒</button>
        <button class="btn btn-rank" onclick="openRank()">PLACAR 🪧</button>
    </div>

    <!-- Menus omitidos para brevidade no texto, mas mantidos na lógica -->
    <div id="rankMenu" class="overlay"><div class="rank-card"><h2>RANKING</h2><div id="rankBody"></div><button class="btn btn-menu" onclick="closeRank()">VOLTAR</button></div></div>
    <div id="shopMenu" class="overlay"><h1>LOJA</h1><p>💎 <span id="shopCoins">0</span></p><button id="btnHero" class="btn btn-shop" onclick="handleSkinAction('herobrine')">HEROBRINE (2500 💎)</button><button id="btnBeast" class="btn btn-shop" style="background:#2196f3" onclick="handleSkinAction('mrbeast')">MR BEAST (250 💎)</button><button class="btn btn-menu" onclick="closeShop()">VOLTAR</button></div>
    <div id="nameScreen" class="overlay"><h1>NOME?</h1><input type="text" id="userNameInput" class="name-input"><button class="btn btn-start" onclick="saveNameAndStart()">OK</button></div>
    <div id="profileMenu" class="overlay"><div class="rank-card"><h2>PERFIL</h2><p>Nome: <span id="displayUserName"></span></p><button class="btn btn-menu" onclick="closeProfile()">VOLTAR</button></div></div>
    <div id="adminMenu" class="overlay"><h1>ADMIN</h1><input type="password" id="adminPass" class="admin-input"><button class="btn btn-start" onclick="checkAdmin()">ENTRAR</button></div>
    <div id="deathMenu" class="overlay"><h1>FIM DE JOGO</h1><button class="btn btn-start" onclick="initGame(false)">RECOMEÇAR</button></div>

    <div id="ui">👤 <span id="skinLabel">STEVE</span> | 🏁 <span id="dist">0</span>m | 💎 <span id="coins">0</span> <span id="abilityStatus"></span></div>
    <div id="checkpointMsg">CHECKPOINT! 🚩</div>

    <div class="controls" id="mobileControls">
        <div style="display:flex; gap:15px"><div class="ctrl-btn" id="btnLeft">←</div><div class="ctrl-btn" id="btnRight">→</div></div>
        <div class="ctrl-btn" id="btnJump">↑</div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let gameRunning = false, world = {}, cameraX = 0, coins = parseInt(localStorage.getItem("steve_coins")) || 0;
let userName = localStorage.getItem("steve_user_name") || "", currentSkin = "steve";
let gems = [], lastGeneratedX = 0, checkpointsAchieved = [];
let metersAtLastTp = 0, canDoubleJump = true, doubleJumpUsedInAir = false, metersAtLastDoubleJump = 0;

const player = { x: 100, y: 300, w: 32, h: 64, vx: 0, vy: 0, onGround: false };
const input = { left: false, right: false };

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

function generateBlocks(count) {
    for(let i = 0; i < count; i++) {
        lastGeneratedX += 200;
        let y = Math.floor((300 + Math.random() * 200)/50)*50;
        world[`${lastGeneratedX},${y}`] = "grass";
        let rand = Math.random();
        let type = (rand < 0.10) ? "red" : ((rand < 0.30) ? "blue" : "green");
        gems.push({x: lastGeneratedX + 15, y: y - 60, type: type, collected: false});
    }
}

function initGame(reset) {
    if(reset) { world = {}; gems = []; lastGeneratedX = 0; generateBlocks(30); }
    gameRunning = true; document.getElementById("menu").style.display = "none"; document.getElementById("ui").style.display = "block";
    requestAnimationFrame(loop);
}

function loop() {
    if(!gameRunning) return;
    let m = Math.floor(player.x / 50);
    
    // Checkpoints e Habilidades HUD
    if (m > 0 && m % 100 === 0 && !checkpointsAchieved.includes(m)) {
        checkpointsAchieved.push(m);
        document.getElementById("checkpointMsg").style.display = "block";
        setTimeout(() => { document.getElementById("checkpointMsg").style.display = "none"; }, 2000);
    }

    if(currentSkin === "mrbeast") {
        let diff = m - metersAtLastDoubleJump;
        document.getElementById("abilityStatus").innerText = (diff >= 80) ? " | PULO PRONTO! ✅" : ` | RECARGA: ${80-diff}m`;
    } else if(currentSkin === "herobrine") {
        let diff = m - metersAtLastTp;
        document.getElementById("abilityStatus").innerText = (diff >= 50) ? " | TP PRONTO (Q)! ✅" : ` | TP RECARGA: ${50-diff}m`;
    }

    // Física básica
    player.vy += 0.8; player.y += player.vy; player.onGround = false;
    for(let pos in world) {
        let [bx, by] = pos.split(",").map(Number);
        if(player.x+32 > bx && player.x < bx+50 && player.y+64 > by && player.y+64 < by+20 && player.vy > 0) {
            player.y = by - 64; player.vy = 0; player.onGround = true;
        }
    }
    player.x += 6; 
    cameraX += (player.x - canvas.width/3 - cameraX) * 0.1;
    if(player.x > lastGeneratedX - 1000) generateBlocks(10);

    // Desenho
    ctx.clearRect(0,0,canvas.width, canvas.height);
    for(let pos in world) { let [bx, by] = pos.split(",").map(Number); ctx.fillStyle = "#4caf50"; ctx.fillRect(bx-cameraX, by, 50, 15); }
    
    gems.forEach(g => {
        if(!g.collected && Math.abs(player.x-g.x)<40 && Math.abs(player.y-g.y)<60) {
            g.collected = true; coins += (g.type === "red" ? 10 : (g.type === "blue" ? 5 : 1));
            document.getElementById("coins").innerText = coins;
        }
        if(!g.collected) { ctx.fillStyle = (g.type === "red" ? "#ff0000" : (g.type === "blue" ? "#0000ff" : "#00ff00")); ctx.fillRect(g.x-cameraX, g.y, 20, 20); }
    });

    // Personagem (Simplificado para loop)
    ctx.fillStyle = "#3c44aa"; ctx.fillRect(player.x-cameraX+4, player.y+40, 24, 24); 
    ctx.fillStyle = "#d3a395"; ctx.fillRect(player.x-cameraX+4, player.y, 24, 20);
    
    document.getElementById("dist").innerText = m;
    if(player.y > canvas.height) document.getElementById("deathMenu").style.display = "flex";
    else requestAnimationFrame(loop);
}

window.addEventListener("keydown", (e) => {
    let m = Math.floor(player.x / 50);
    if(e.code === "Space") {
        if(player.onGround) { player.vy = -17; }
        else if(currentSkin === "mrbeast" && (m - metersAtLastDoubleJump >= 80)) { player.vy = -15; metersAtLastDoubleJump = m; }
    }
    if(e.code === "KeyQ" && currentSkin === "herobrine" && (m - metersAtLastTp >= 50)) { player.x += 400; metersAtLastTp = m; }
});
</script>
</body>
</html>
