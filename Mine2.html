<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Steve Parkour HD - Versão Completa</title>
    <style>
        body { margin: 0; overflow: hidden; background: #9db9eb; font-family: 'Arial', sans-serif; touch-action: none; }
        canvas { display: block; }
        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); color: white; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 500; }
        .btn { width: 280px; padding: 15px; margin: 10px; font-size: 18px; border-radius: 12px; cursor: pointer; border: none; font-weight: bold; }
        #ui { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.5); color: white; padding: 10px; border-radius: 8px; z-index: 100; pointer-events: none; }
        #checkpointMsg { position: absolute; top: 20%; width: 100%; text-align: center; color: #ffeb3b; font-size: 40px; font-weight: bold; display: none; text-shadow: 2px 2px #000; z-index: 200; }
        .admin-input { padding: 10px; margin: 10px; }
    </style>
</head>
<body>

    <!-- MENUS -->
    <div id="menu" class="overlay" style="display: flex;">
        <h1>STEVE PARKOUR</h1>
        <button class="btn" style="background:#4caf50" onclick="startGame()">JOGAR</button>
        <button class="btn" style="background:#9c27b0" onclick="document.getElementById('shopMenu').style.display='flex'">LOJA 🛒</button>
        <button class="btn" style="background:#757575" onclick="document.getElementById('adminMenu').style.display='flex'">ADMIN 🔑</button>
    </div>

    <div id="adminMenu" class="overlay">
        <h1>LOGIN ADMIN</h1>
        <input type="password" id="adminPass" class="admin-input" placeholder="Senha...">
        <button class="btn" onclick="checkAdmin()">ENTRAR</button>
        <button class="btn" onclick="this.parentElement.style.display='none'">VOLTAR</button>
    </div>

    <div id="shopMenu" class="overlay">
        <h1>LOJA</h1>
        <button class="btn" onclick="currentSkin='mrbeast'; this.parentElement.style.display='none'">USAR MRBEAST</button>
        <button class="btn" onclick="currentSkin='herobrine'; this.parentElement.style.display='none'">USAR HEROBRINE</button>
        <button class="btn" onclick="this.parentElement.style.display='none'">VOLTAR</button>
    </div>

    <div id="deathMenu" class="overlay"><h1>FIM DE JOGO</h1><button class="btn" onclick="location.reload()">MENU</button></div>
    
    <div id="checkpointMsg">CHECKPOINT! 🚩</div>
    <div id="ui">👤 <span id="skinLabel">STEVE</span> | 🏁 <span id="dist">0</span>m | 💎 <span id="coins">0</span> <span id="abilityStatus"></span></div>

    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let gameRunning = false, world = {}, cameraX = 0, coins = 0;
let player = { x: 100, y: 300, w: 32, h: 64, vx: 0, vy: 0, onGround: false };
let gems = [], lastGeneratedX = 0, checkpointsAchieved = [];
let currentSkin = "steve", lastTpTime = 0, canDoubleJump = true, doubleJumpUsedInAir = false, metersAtLastDoubleJump = 0;

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

function checkAdmin() {
    if(document.getElementById("adminPass").value === "gu_totoso_24/11/2015") {
        alert("Modo Admin Ativado!");
        document.getElementById("adminMenu").style.display = 'none';
    } else { alert("Senha incorreta!"); }
}

function generateBlocks(count) {
    for(let i = 0; i < count; i++) {
        lastGeneratedX += 200;
        let y = Math.floor((300 + Math.random() * 200)/50)*50;
        world[`${lastGeneratedX},${y}`] = "grass";
        let rand = Math.random();
        let type = (rand < 0.10) ? "red" : ((rand < 0.30) ? "blue" : "green");
        gems.push({x: lastGeneratedX + 15, y: y - 60, type: type, collected: false});
    }
}

function startGame() {
    document.getElementById("menu").style.display = "none";
    generateBlocks(20);
    gameRunning = true;
    loop();
}

function loop() {
    if(!gameRunning) return;
    let m = Math.floor(player.x / 50);
    
    // Checkpoint
    if (m > 0 && m % 100 === 0 && !checkpointsAchieved.includes(m)) {
        checkpointsAchieved.push(m);
        document.getElementById("checkpointMsg").style.display = "block";
        setTimeout(() => { document.getElementById("checkpointMsg").style.display = "none"; }, 2000);
    }

    // Física
    player.vy += 0.8; player.y += player.vy;
    player.onGround = false;
    for(let pos in world) {
        let [bx, by] = pos.split(",").map(Number);
        if(player.x+32 > bx && player.x < bx+50 && player.y+64 > by && player.y+64 < by+20 && player.vy > 0) {
            player.y = by - 64; player.vy = 0; player.onGround = true;
        }
    }
    player.x += 6; 
    cameraX += (player.x - canvas.width/3 - cameraX) * 0.1;
    if(player.x > lastGeneratedX - 1000) generateBlocks(10);

    // Habilidades
    if(currentSkin === "mrbeast") {
        let diff = m - metersAtLastDoubleJump;
        if(diff >= 80) canDoubleJump = true;
        document.getElementById("abilityStatus").innerText = canDoubleJump ? " | PULO: PRONTO ✅" : ` | RECARGA: ${80-diff}m`;
    }

    // Desenho
    ctx.clearRect(0,0,canvas.width, canvas.height);
    for(let pos in world) { let [bx, by] = pos.split(",").map(Number); ctx.fillStyle = "#4caf50"; ctx.fillRect(bx-cameraX, by, 50, 15); }
    
    // Esmeraldas
    gems.forEach(g => {
        if(!g.collected && Math.abs(player.x-g.x)<40 && Math.abs(player.y-g.y)<60) {
            g.collected = true;
            coins += (g.type === "red" ? 10 : (g.type === "blue" ? 5 : 1));
            document.getElementById("coins").innerText = coins;
        }
        if(!g.collected) {
            ctx.fillStyle = (g.type === "red" ? "#ff0000" : (g.type === "blue" ? "#0000ff" : "#00ff00"));
            ctx.fillRect(g.x-cameraX, g.y, 20, 20);
        }
    });

    // Personagem (Textura Clássica)
    ctx.fillStyle = "#3c44aa"; ctx.fillRect(player.x-cameraX+4, player.y+40, 10, 24); ctx.fillRect(player.x-cameraX+18, player.y+40, 10, 24);
    ctx.fillStyle = "#3aa0a2"; ctx.fillRect(player.x-cameraX+4, player.y+18, 24, 22);
    ctx.fillStyle = "#d3a395"; ctx.fillRect(player.x-cameraX+4, player.y, 24, 20);

    document.getElementById("dist").innerText = m;
    document.getElementById("skinLabel").innerText = currentSkin.toUpperCase();
    if(player.y > canvas.height) document.getElementById("deathMenu").style.display = "flex";
    else requestAnimationFrame(loop);
}

window.addEventListener("keydown", (e) => {
    if(e.code === "Space") {
        if(player.onGround) { player.vy = -17; doubleJumpUsedInAir = false; }
        else if(currentSkin === "mrbeast" && canDoubleJump && !doubleJumpUsedInAir) { player.vy = -15; canDoubleJump = false; doubleJumpUsedInAir = true; metersAtLastDoubleJump = Math.floor(player.x/50); }
    }
    if(e.code === "KeyQ" && currentSkin === "herobrine" && Date.now() - lastTpTime > 2000) { player.x += 400; lastTpTime = Date.now(); }
});
</script>
</body>
</html>
