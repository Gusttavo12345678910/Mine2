<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Parkour Incrível do Minecraft- Ultimate Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #9db9eb; font-family: 'Arial', sans-serif; }
        canvas { display: block; touch-action: none; } /* Movido pra cá pra não bloquear botões */
        
        #menu, #deathMenu, #shopMenu, #recordMenu, #adminMenu { 
            position: absolute; inset: 0; background: #9db9eb; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 200; text-align: center;
        }
        #deathMenu, #shopMenu, #recordMenu, #adminMenu { background: rgba(0,0,0,0.95); color: white; display: none; z-index: 300; }

        /* Estilo Painel Admin */
        #adminMenu { z-index: 500; background: rgba(20, 20, 20, 0.98); border: 4px solid #ff0000; }
        .admin-input { padding: 10px; margin: 5px; border-radius: 5px; border: none; width: 250px; }

        .btn { 
            width: 280px; padding: 15px; margin: 6px; font-size: 18px; font-weight: bold; color: white; 
            border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px #222; 
            touch-action: manipulation; /* Fix mobile tap */
            -webkit-tap-highlight-color: transparent; /* Remove highlight azul no Android/iOS */
        }
