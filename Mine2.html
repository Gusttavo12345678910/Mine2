<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Steve Parkour HD - COMPLETÍSSIMO</title>
    <style>
        body { margin: 0; overflow: hidden; background: #9db9eb; font-family: 'Arial', sans-serif; touch-action: none; }
        canvas { display: block; }
        .overlay { position: absolute; inset: 0; background: #9db9eb; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 500; text-align: center; }
        #deathMenu, #shopMenu, #adminMenu, #nameScreen, #profileMenu, #rankMenu { background: rgba(0,0,0,0.9); color: white; }
        .btn { width: 280px; padding: 15px; margin: 10px; font-size: 18px; font-weight: bold; color: white; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px #222; }
        .btn-start { background: #4caf50; }
        .btn-shop { background: #9c27b0; }
        .btn-rank { background: #ff9800; }
        .btn-menu { background: #757575; }
        .name-input, .admin-input { padding: 12px; margin: 8px; border-radius: 8px; border: 1px solid #00e5ff; width: 260px; }
        #mainProfileBtn { position: absolute; top: 15px; left: 15px; width: 120px; background: #2196f3; z-index: 1000; padding: 10px; border-radius: 10px; border: none; color: white; font-weight: bold; cursor: pointer; }
        #ui { position: absolute; top: 10px; left: 150px; background: rgba(0,0,0,0.7); color: white; padding: 10px; border-radius: 8px; z-index: 100; display: none; border: 1px solid #fff; pointer-events: none; }
        .rank-card { background: #333; padding: 20px; border-radius: 20px; border: 2px solid #ff9800; width: 85%; max-width: 450px; }
        table { width: 100%; margin-top: 10px; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #444; }
        .highlight { color: #00e5ff; font-weight: bold; }
        .controls { position: absolute; bottom: 20px; width: 100%; display: none; justify-content: space-between; padding: 0 30px; box-sizing: border-box; z-index: 150; }
        .ctrl-btn { width: 70px; height: 70px; background: rgba(255,255,255,0.3); border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 25px; color: white; }
    </style>
</head>
<body>

    <button id="mainProfileBtn" onclick="openProfile()">👤 PERFIL</button>

    <div id="menu" class="overlay" style="display: flex;">
        <h1 style="color:white; text-shadow: 3px 3px #000; font-size: 40px;">STEVE PARKOUR</h1>
        <button class="btn btn-start" onclick="checkNameBeforeStart()">JOGAR</button>
        <button class="btn btn-shop" onclick="openShop()">LOJA SKINS 🛒</button>
        <button class="btn btn-rank" onclick="openRank()">PLACAR 🪧</button>
    </div>

    <!-- Menus (Rank, Shop, Name, Profile, Admin, Death) omitidos para brevidade, mantenha os que já existiam -->
    <div id="rankMenu" class="overlay"><div class="rank-card"><h2>RANKING</h2><div id="rankBody"></div><button class="btn btn-menu" onclick="closeRank()">VOLTAR</button></div></div>
    <div id="shopMenu" class="overlay"><h1>LOJA</h1><p>💎 <span id="shopCoins">0</span></p><button id="btnHero" class="btn btn-shop" onclick="handleSkinAction('herobrine')">HEROBRINE (2500 💎)</button><button id="btnBeast" class="btn btn-shop" style="background:#2196f3" onclick="handleSkinAction('mrbeast')">MR BEAST (250 💎)</button><button class="btn btn-menu" onclick="closeShop()">VOLTAR</button></div>
    <div id="nameScreen" class="overlay"><h1>NOME?</h1><input type="text" id="userNameInput" class="name-input"><button class="btn btn-start" onclick="saveNameAndStart()">OK</button></div>
    <div id="profileMenu" class="overlay"><div class="rank-card"><h2>PERFIL</h2><p>Nome: <span id="displayUserName"></span></p><p>Recorde: <span id="profileBest">0</span>m</p><button class="btn btn-menu" onclick="closeProfile()">VOLTAR</button></div></div>
    <div id="deathMenu" class="overlay"><h1>FIM DE JOGO</h1><button class="btn btn-start" onclick="initGame(false)">RECOMEÇAR</button></div>

    <div id="ui">👤 <span id="skinLabel">STEVE</span> | 🏁 <span id="dist">0</span>m <span id="abilityStatus"></span></div>

    <div class="controls" id="mobileControls">
        <div style="display:flex; gap:15px"><div class="ctrl-btn" id="btnLeft">←</div><div class="ctrl-btn" id="btnRight">→</div></div>
        <div class="ctrl-btn" id="btnJump">↑</div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let gameRunning = false, physicsActive = false, world = {}, cameraX = 0;
let coins = parseInt(localStorage.getItem("steve_coins")) || 0;
let highScore = parseInt(localStorage.getItem("steve_record")) || 0;
let userName = localStorage.getItem("steve_user_name") || "";
let hasHerobrine = localStorage.getItem("skin_herobrine") === "true";
let hasMrBeast = localStorage.getItem("skin_mrbeast") === "true";
let currentSkin = "steve";
let gems = [], lastGeneratedX = 0;
let lastTpTime = 0; // Para TP Herobrine
let canDoubleJump = true; // Para MrBeast
let doubleJumpUsedInAir = false;
let metersAtLastDoubleJump = 0;

const player = { x: 100, y: 0, w: 32, h: 64, vx: 0, vy: 0, onGround: false };
const input = { left: false, right: false };

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

function generateBlocks(count) {
    for(let i = 0; i < count; i++) {
        lastGeneratedX += 160 + Math.random() * 80;
        let y = Math.floor((300 + Math.random() * 200)/50)*50;
        let bx = Math.floor(lastGeneratedX / 50) * 50;
        world[`${bx},${y}`] = "grass";
    }
}

function handleJump() {
    physicsActive = true;
    let currentMeters = Math.floor(player.x / 50);
    if(player.onGround) { player.vy = -17; player.onGround = false; doubleJumpUsedInAir = false; } 
    else if(currentSkin === "mrbeast" && !doubleJumpUsedInAir && canDoubleJump) { 
        player.vy = -15; doubleJumpUsedInAir = true; canDoubleJump = false; metersAtLastDoubleJump = currentMeters;
    }
}

function initGame(reset) {
    if(reset) { world = {}; lastGeneratedX = 0; for(let i=0; i<15; i++) { world[`${i*50},400`] = "grass"; lastGeneratedX = i*50; } generateBlocks(20); }
    player.x = 100; player.y = 300; player.vy = 0; gameRunning = true; document.getElementById("menu").style.display = "none"; document.getElementById("ui").style.display = "block";
    requestAnimationFrame(loop);
}

function loop() {
    if(!gameRunning) return;
    let currentMeters = Math.floor(player.x / 50);
    
    // HUD Lógica
    if(currentSkin === "mrbeast") {
        let needed = 80 - (currentMeters - metersAtLastDoubleJump);
        document.getElementById("abilityStatus").innerText = canDoubleJump ? " | PULO PRONTO! ✅" : ` | RECARGA: ${needed}m`;
    } else { document.getElementById("abilityStatus").innerText = ""; }

    // Física
    if(physicsActive) {
        if(input.left) player.vx = -6.5; else if(input.right) player.vx = 6.5; else player.vx *= 0.8;
        player.vy += 0.8; player.x += player.vx; player.y += player.vy;
        player.onGround = false;
        for(let pos in world) {
            let [bx, by] = pos.split(",").map(Number);
            if(player.x+player.w > bx && player.x < bx+50 && player.y+player.h > by && player.y+player.h < by+20 && player.vy > 0) {
                player.y = by - player.h; player.vy = 0; player.onGround = true;
            }
        }
        if(player.x > lastGeneratedX - 1000) generateBlocks(15);
        cameraX += (player.x - canvas.width/3 - cameraX) * 0.1;
    }

    // Desenho
    ctx.clearRect(0,0,canvas.width, canvas.height);
    for(let pos in world) { let [bx, by] = pos.split(",").map(Number); ctx.fillStyle = "#4caf50"; ctx.fillRect(bx-cameraX, by, 50, 15); }
    
    // Skin Steve Clássico
    let sx = player.x - cameraX, sy = player.y;
    ctx.fillStyle = "#3c44aa"; ctx.fillRect(sx+4, sy+40, 10, 24); ctx.fillRect(sx+18, sy+40, 10, 24); // Calça
    ctx.fillStyle = "#3aa0a2"; ctx.fillRect(sx+4, sy+18, 24, 22); // Camiseta
    ctx.fillStyle = "#d3a395"; ctx.fillRect(sx+4, sy, 24, 20); // Cabeça
    
    document.getElementById("dist").innerText = currentMeters;
    requestAnimationFrame(loop);
}

// Controles
window.addEventListener("keydown", (e) => {
    if(e.code === "Space") handleJump();
    if(e.code === "KeyQ" && currentSkin === "herobrine" && Date.now() - lastTpTime > 2000) { player.x += 400; lastTpTime = Date.now(); }
});
</script>
</body>
</html>
