<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Parkour Incrível do Minecraft - Ultimate Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #9db9eb; font-family: 'Arial', sans-serif; touch-action: none; }
        canvas { display: block; }
        
        #menu, #deathMenu, #shopMenu, #recordMenu, #adminMenu { 
            position: absolute; inset: 0; background: #9db9eb; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 200; text-align: center;
        }
        #deathMenu, #shopMenu, #recordMenu, #adminMenu { background: rgba(0,0,0,0.95); color: white; display: none; z-index: 300; }

        #adminMenu { z-index: 500; background: rgba(20, 20, 20, 0.98); border: 4px solid #ff0000; }
        .admin-input { padding: 10px; margin: 5px; border-radius: 5px; border: none; width: 250px; }

        .btn { width: 280px; padding: 15px; margin: 6px; font-size: 18px; font-weight: bold; color: white; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px #222; }
        .btn-start { background: #4caf50; }
        .btn-shop { background: #9c27b0; }
        .btn-record { background: #ff9800; }
        .btn-menu { background: #757575; }
        .btn-admin { background: #d32f2f; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px #111; }
        
        #ui { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 10px; border-radius: 8px; z-index: 100; display: none; font-size: 14px; border: 1px solid #fff; }
        #abilityHUD { position: absolute; top: 10px; right: 10px; width: 70px; height: 70px; background: rgba(0,0,0,0.8); border: 2px solid #00e5ff; border-radius: 10px; display: none; z-index: 100; overflow: hidden; }
        #abilityFill { position: absolute; bottom: 0; width: 100%; background: rgba(0, 229, 255, 0.5); transition: height 0.2s; }
        
        #checkpointMsg { position: absolute; top: 20%; width: 100%; text-align: center; color: #00e5ff; font-size: 32px; font-weight: bold; display: none; text-shadow: 3px 3px #000; z-index: 150; pointer-events: none; animation: pop 0.5s ease; }
        @keyframes pop { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }

        .controls { position: absolute; bottom: 20px; width: 100%; display: none; justify-content: space-between; padding: 0 30px; box-sizing: border-box; z-index: 150; }
        .ctrl-btn { width: 70px; height: 70px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 25px; color: white; user-select: none; }
        .power-btn { background: rgba(0, 229, 255, 0.3); border-color: #00e5ff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="checkpointMsg">CHECKPOINT! 🚩</div>

    <div id="menu">
        <h1 style="color:white; text-shadow: 3px 3px #000; margin: 10px; font-size: 40px;">PARKOUR INCRÍVEL DO MINECRAFT</h1>
        <button class="btn btn-start" onclick="initGame(true)">JOGAR</button>
        <button class="btn btn-shop" onclick="openShop()">LOJA SKINS 🛒</button>
        <button class="btn btn-record" onclick="openRecord()">RECORDES 🏆</button>
    </div>

    <div id="adminMenu">
        <h1 style="color: #ff0000;">🛡️ PAINEL ADMINISTRADOR</h1>
        <div id="adminLogin">
            <input type="email" id="adminEmail" class="admin-input" placeholder="E-mail do Admin">
            <input type="password" id="adminPass" class="admin-input" placeholder="Senha Secreta">
            <button class="btn btn-start" onclick="checkAdminLogin()">ENTRAR</button>
        </div>
        <div id="adminControls" style="display: none;">
            <button class="btn btn-shop" onclick="adminAddGems()">+10.000 ESMERALDAS 💎</button>
            <button class="btn btn-record" onclick="adminToggleGod()">MODO DEUS: <span id="godStatus">OFF</span></button>
            <button class="btn btn-start" onclick="adminSuperJump()">SUPER PULO ATIVADO</button>
            <button class="btn btn-menu" onclick="closeAdmin()">SAIR</button>
        </div>
        <button class="btn btn-menu" id="adminBackBtn" onclick="closeAdmin()">VOLTAR</button>
    </div>

    <div id="recordMenu">
        <h1>🏆 SEU MELHOR RECORDE</h1>
        <p style="font-size: 45px; color: #ff9800; margin: 20px;"><span id="bestDist">0</span>m</p>
        <button class="btn btn-menu" onclick="closeRecord()">VOLTAR</button>
    </div>

    <div id="shopMenu">
        <h1>LOJA</h1>
        <p>Tuas Esmeraldas: <canvas id="shopEmerald" width="40" height="40" style="vertical-align: middle; margin: 0 8px;"></canvas> <span id="shopCoins">0</span></p>
        <div style="background: rgba(255,255,255,0.1); padding: 25px; border-radius: 20px; border: 3px solid #00e5ff; margin-bottom: 15px;">
            <h2 style="color: #00e5ff;">HEROBRINE</h2>
            <p>Especial: Cria 9 blocos de Diamante<br>Recarga: 150 metros percorridos</p>
            <button id="buyHeroBtn" class="btn btn-shop" onclick="handleSkinAction()">COMPRAR (2.500 💎)</button>
        </div>
        <button class="btn btn-menu" onclick="closeShop()">VOLTAR</button>
    </div>

    <div id="ui">👤 <span id="skinLabel">Steve</span> | <span id="adminTrigger" onclick="handleAdminTrigger()" style="cursor: pointer;">🏁 <span id="dist">0</span>m</span> | <canvas id="uiEmerald" width="20" height="20" style="vertical-align: middle;"></canvas> <span id="coins">0</span></div>
    
    <div id="abilityHUD"><div id="abilityFill"></div><div style="position:relative; z-index:2; text-align:center; padding-top:20px; font-size:22px; color:white; font-weight:bold;">W</div></div>

    <div id="deathMenu">
        <h1 style="color:#ff5252; font-size: 40px;">VOCÊ MORREU</h1>
        <p id="deathResult" style="font-size: 20px;"></p>
        <button class="btn btn-start" onclick="initGame(false)">CHECKPOINT 🚩</button>
        <button class="btn btn-menu" onclick="location.reload()">MENU PRINCIPAL</button>
    </div>

    <div class="controls" id="mobileControls">
        <div style="display: flex; gap: 15px;"><div class="ctrl-btn" id="btnLeft">←</div><div class="ctrl-btn" id="btnRight">→</div></div>
        <div style="display: flex; gap: 15px;"><div class="ctrl-btn power-btn" id="btnPower">W</div><div class="ctrl-btn" id="btnJump">↑</div></div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let gameRunning = false, physicsActive = false, world = {}, cameraX = 0, lastX = 0;
let coins = parseInt(localStorage.getItem("steve_coins")) || 0;
let highScore = parseInt(localStorage.getItem("steve_record")) || 0;
let gems = [], hasHerobrine = localStorage.getItem("skin_herobrine") === "true", currentSkin = "steve";
let abilityReady = true, blocksLeftToPlace = 0, lastUsedDist = 0;

// Variáveis Admin
let adminClicks = 0, lastClickTime = 0, isGodMode = false;

let lastCheckpoint = { x: 100, y: 0 };
let checkpointsAchieved = [];
const CHECKPOINT_INTERVAL = 80;

const RECHARGE_DIST = 150, BLOCKS_PER_USE = 9;
let GRAV_UP = 0.7, GRAV_DOWN = 0.82, JUMP_FORCE = -17.5, SPEED = 6.5;
const player = { x: 100, y: 0, w: 32, h: 64, vx: 0, vy: 0, onGround: false };
const input = { left: false, right: false };

// Função nova: Desenha uma esmeralda estilo Minecraft (pixel art simples)
function drawEmerald(ctx, x, y, size = 20) {
    ctx.save();
    ctx.translate(x, y);

    // Fundo verde escuro (base)
    ctx.fillStyle = "#1B5E20";
    ctx.fillRect(2, 8, size-4, size-12);

    // Verde principal brilhante
    ctx.fillStyle = "#00E676";
    ctx.beginPath();
    ctx.moveTo(size/2, 2);
    ctx.lineTo(size-4, size/3);
    ctx.lineTo(size/2, size-4);
    ctx.lineTo(4, size/3);
    ctx.closePath();
    ctx.fill();

    // Facetas/reflexos brancos
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.beginPath();
    ctx.moveTo(size/2 - 3, 6);
    ctx.lineTo(size/2 + 3, 6);
    ctx.lineTo(size/2 + 2, size/2 - 2);
    ctx.lineTo(size/2 - 2, size/2 - 2);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.fillRect(size/2 - 4, size-8, 8, 4);

    // Bordas escuras pra dar profundidade
    ctx.strokeStyle = "#004D40";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(2, 4, size-4, size-8);

    ctx.restore();
}

// Desenha esmeralda no UI e shop (chama uma vez no init)
function updateEmeraldIcons() {
    const uiCtx = document.getElementById("uiEmerald").getContext("2d");
    drawEmerald(uiCtx, 0, 0, 20);

    const shopCtx = document.getElementById("shopEmerald").getContext("2d");
    drawEmerald(shopCtx, 0, 0, 40);
}

// Chama no início
updateEmeraldIcons();

// --- RESTANTE DO CÓDIGO (só mudei a parte das gems pra desenhar esmeralda) ---

// ... (o resto do código continua igual, só substitui a parte de desenho das gems no loop)

function loop() {
    if(!gameRunning) return;
    if(physicsActive) {
        // ... (código de física igual)

        gems.forEach(gem => {
            if (!gem.collected && player.x < gem.x + 25 && player.x + player.w > gem.x && player.y < gem.y + 35 && player.y + player.h > gem.y) {
                gem.collected = true; coins++; localStorage.setItem("steve_coins", coins);
                document.getElementById("coins").innerText = coins;
            }
        });

        // ... (resto da física igual)
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // ... (desenho do world igual)

    // Desenha as gems como esmeraldas
    gems.forEach(gem => { 
        if (!gem.collected && gem.x > cameraX - 50 && gem.x < cameraX + canvas.width) { 
            drawEmerald(ctx, gem.x - cameraX - 10, gem.y - 10, 40);  // tamanho maior pra ficar visível
        } 
    });
    
    // ... (resto do desenho do player e tudo igual)

    document.getElementById("dist").innerText = Math.floor(player.x/50);
    requestAnimationFrame(loop);
}

// Atualiza ícones quando abre shop também
function openShop() { 
    document.getElementById("shopCoins").innerText = coins; 
    const btn = document.getElementById("buyHeroBtn"); 
    if(hasHerobrine) btn.innerText = (currentSkin === "herobrine") ? "EQUIPADO" : "EQUIPAR"; 
    else btn.innerText = "COMPRAR (2.500 💎)"; 
    document.getElementById("shopMenu").style.display = "flex"; 
    updateEmeraldIcons();  // garante que desenhe
}

// ... (resto do código igual: initGame, eventos, etc.)

function initGame(resetAll) {
    // ... (igual)
    updateEmeraldIcons();  // atualiza no início do jogo
    // ... (resto igual)
}
</script>
</body>
</html>
